<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="casinoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="12" fill="url(#casinoBg)"/>

  <!-- Subtle Felt Pattern Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Poker Cards -->
  <g transform="translate(190, 80) rotate(-12)" filter="url(#glow)">
    <rect width="90" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="14" y="28" font-family="sans-serif" font-size="20" font-weight="bold" fill="#dc2626">A</text>
    <text x="14" y="44" font-family="sans-serif" font-size="14" fill="#dc2626">♥</text>
    <text x="45" y="78" font-family="sans-serif" font-size="34" fill="#dc2626" text-anchor="middle">♥</text>
  </g>

  <g transform="translate(250, 75) rotate(10)" filter="url(#glow)">
    <rect width="90" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="14" y="28" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a">A</text>
    <text x="14" y="44" font-family="sans-serif" font-size="14" fill="#0f172a">♠</text>
    <text x="45" y="78" font-family="sans-serif" font-size="34" fill="#0f172a" text-anchor="middle">♠</text>
  </g>

  <!-- Golden Casino Chip -->
  <g transform="translate(390, 160)">
    <circle cx="0" cy="0" r="46" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#ffffff" stroke-dasharray="8 6" stroke-width="3"/>
    <circle cx="0" cy="0" r="24" fill="#1e1b4b"/>
    <text x="0" y="8" font-family="sans-serif" font-size="18" font-weight="900" fill="#f59e0b" text-anchor="middle">777</text>
  </g>

  <!-- Die -->
  <g transform="translate(130, 190) rotate(18)">
    <rect width="52" height="52" rx="10" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
    <circle cx="16" cy="16" r="4" fill="#ffffff"/>
    <circle cx="36" cy="16" r="4" fill="#ffffff"/>
    <circle cx="26" cy="26" r="4" fill="#ffffff"/>
    <circle cx="16" cy="36" r="4" fill="#ffffff"/>
    <circle cx="36" cy="36" r="4" fill="#ffffff"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="300" y="275" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">CASINO ONLINE</text>
  <text x="300" y="305" font-family="sans-serif" font-size="15" font-weight="600" fill="#f59e0b" text-anchor="middle" letter-spacing="3">LASAÑA TEAM</text>
  <text x="300" y="332" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">React + Vite · Django · Oracle DB</text>
</svg>
